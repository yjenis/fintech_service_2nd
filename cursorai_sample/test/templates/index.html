<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 뉴스</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .news-card {
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .news-card:hover {
            transform: translateY(-5px);
        }
        .sentiment-positive {
            color: #28a745;
        }
        .sentiment-negative {
            color: #dc3545;
        }
        .sentiment-neutral {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">주식 뉴스</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div id="news-container"></div>
            </div>
        </div>
    </div>

    <script>
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getSentimentClass(sentiment) {
            if (sentiment > 0.2) return 'sentiment-positive';
            if (sentiment < -0.2) return 'sentiment-negative';
            return 'sentiment-neutral';
        }

        async function fetchNews() {
            try {
                const response = await fetch('/api/news');
                const data = await response.json();
                const newsContainer = document.getElementById('news-container');
                
                if (data.feed) {
                    newsContainer.innerHTML = data.feed.map(news => `
                        <div class="card news-card">
                            <div class="card-body">
                                <h5 class="card-title">${news.title}</h5>
                                <p class="card-text">${news.summary}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <small class="text-muted">${formatDate(news.time_published)}</small>
                                    <span class="${getSentimentClass(news.overall_sentiment_score)}">
                                        감성 점수: ${(news.overall_sentiment_score * 100).toFixed(1)}%
                                    </span>
                                </div>
                                <a href="${news.url}" target="_blank" class="btn btn-primary mt-2">기사 보기</a>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error fetching news:', error);
            }
        }

        // 페이지 로드 시 뉴스 가져오기
        fetchNews();
        // 5분마다 뉴스 업데이트
        setInterval(fetchNews, 300000);
    </script>
</body>
</html>
